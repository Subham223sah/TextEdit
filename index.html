<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>Text Editor</h1>
        <textarea id="textArea" rows="10" placeholder="Type your text here..."></textarea>
        <div class="button-container">
            <button id="darkModeToggle">Toggle Dark Mode</button>
            <button id="toggleCaseButton">Toggle Case</button>
            <button id="capitalizeButton">Capitalize</button>
            <button id="copyButton">Copy</button>
            <button id="removeExtraSpacesButton">Remove Extra Spaces</button>
            <button id="clearTextButton">Clear All Text</button>
            <button id="increaseFontButton">+ Font Size</button>
            <button id="decreaseFontButton">- Font Size</button>
            <button id="resetButton">Reset</button>
            <button id="boldButton">Bold</button>
            <button id="italicButton">Italic</button>
        </div>
    </div>
</body>
<script src="main.js"></script>
</html>
